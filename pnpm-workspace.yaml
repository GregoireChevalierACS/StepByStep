packages:
  - packages/*
  - apps/*

overrides:
  # Correctif de sécurité (GHSA-4mjr-xmp4-gh2g et deux autres DoS) : qs est figé en 6.15.1
  # par typed-rest-client, dépendance de développement de @stryker-mutator/core (envoi des
  # rapports au tableau de bord Stryker). À retirer dès que Stryker embarque qs >= 6.16.
  qs: ^6.16.0

# Vulnérabilités élevées sans aucune version corrigée publiée, apportées par l'outillage de
# développement d'Expo (apps/mobile). Elles tournent sur le poste du développeur, jamais dans
# l'APK, et ne sont pas atteignables dans notre usage. Ignorées une par une : `pnpm audit
# --audit-level high` reste bloquant en CI pour toute autre vulnérabilité. À retirer dès
# qu'Expo embarque une version corrigée (vérifier à chaque mise à jour d'Expo).
auditConfig:
  ignoreGhsas:
    # node-forge <= 1.4.0 (vérification de signature RSA trop permissive), via expo > @expo/cli :
    # utilisé seulement pour la signature de code iOS et des manifestes expo-updates, que
    # l'app (Android seul, sans expo-updates) n'utilise pas.
    - GHSA-86w9-cpqp-85rv
    # braces <= 3.0.3 (déni de service par motifs imbriqués), via expo > @expo/metro >
    # metro-file-map > micromatch : les motifs viennent de la configuration de Metro, jamais
    # d'une entrée extérieure.
    - GHSA-vfj7-8cjw-p6xm

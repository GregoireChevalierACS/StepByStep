name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Bloque la PR si une dépendance a une vulnérabilité de niveau élevé ou critique.
      - name: Audit de sécurité des dépendances
        run: pnpm audit --audit-level high

      - name: Format des messages de commit
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Tests + couverture : échoue si la couverture du domaine passe sous 100 %.
      - run: pnpm test:coverage

      # Seuil bloquant : la commande échoue si le score de mutation du domaine passe sous 80 %.
      - name: Test de mutation du domaine (Stryker)
        run: pnpm --filter @stepbystep/domain test:mutation

      - name: Rapport de mutation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-mutation
          path: packages/domain/reports/mutation/
          if-no-files-found: ignore

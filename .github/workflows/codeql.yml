name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Chaque lundi à 6 h UTC : détecte aussi les nouvelles règles appliquées à du code inchangé.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # Pas de compilation nécessaire : CodeQL analyse directement les sources TypeScript.
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
